services:
  bot:
    build: .
    container_name: ReminderVoteBot
    restart: unless-stopped
    # Forwards signals so "docker stop" lets the bot save and disconnect
    init: true
    command: >
      sh -c "node src/deploy-commands.js && exec node src/index.js"
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - GUILD_ID=${GUILD_ID}
      - DEFAULT_TZ=${DEFAULT_TZ:-Europe/Paris}
      - BOT_LANG=${BOT_LANG:-fr}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - MARK_SECRET=${MARK_SECRET}
      - PORT=${PORT:-3000}
      - NODE_ENV=production
    volumes:
      - bot_data:/app/data
    ports:
      # Behind a reverse proxy on the same host, prefer "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
      - "${PORT:-3000}:${PORT:-3000}"
volumes:
  bot_data:

